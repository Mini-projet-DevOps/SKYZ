name: SKYZ CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1️⃣ ÉTAPE CI : Qualité du code & Tests (Exécutée sur chaque PR et push)
  test-and-lint:
    name: Lint & Tests Unitaires
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --- Vérification Backend ---
      - name: Installation dépendances Backend
        working-directory: ./backend
        run: npm ci

      - name: Génération client Prisma
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
        run: npx prisma generate

      - name: Lint Backend
        working-directory: ./backend
        run: npm run lint

      - name: Tests Unitaires Backend (Vitest)
        working-directory: ./backend
        run: npm test

      # --- Vérification Frontend ---
      - name: Installation dépendances Frontend
        working-directory: ./frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Build de vérification Frontend
        working-directory: ./frontend
        run: npm run build

  # 2️⃣ ÉTAPE CD : Build & Push Docker Hub (Uniquement lors du merge sur main)
  build-and-push:
    name: Build & Push Docker Images
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration Docker Buildx (Cache rapide pour le jour J)
        uses: docker/setup-buildx-action@v3

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/skyz-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/skyz-backend:v1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=http://localhost:3000
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/skyz-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/skyz-frontend:v1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
